<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Nexify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-container {
            background: white;
            width: 450px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #666;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #cityInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        #searchBtn {
            padding: 12px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #searchBtn:hover {
            background: #5a67d8;
        }

        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            display: none;
        }

        .city-name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
        }

        .condition {
            font-size: 20px;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            opacity: 0.8;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .error-message {
            background: #fee;
            color: #e53e3e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .loading {
            display: none;
            margin: 20px 0;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <h1>🌤️ Weather App</h1>
        <div class="subtitle">Get real-time weather for any city</div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., Peshawar, Lahore, Karachi)">
            <button id="searchBtn">Search</button>
        </div>

        <div class="loading" id="loading">
            ⏳ Fetching weather data...
        </div>

        <div class="weather-card" id="weatherCard">
            <div class="city-name" id="cityName"></div>
            <div class="temperature" id="temperature"></div>
            <div class="condition" id="condition"></div>
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">💧 Humidity</div>
                    <div class="detail-value" id="humidity"></div>
                </div>
                <!-- Wind Speed -->
                <div class="detail-item">
                    <div class="detail-label">💨 Wind Speed</div>
                    <div class="detail-value" id="windSpeed"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">🌡️ Feels Like</div>
                    <div class="detail-value" id="feelsLike"></div>
                </div>
            </div>
        </div>

        <div class="error-message" id="errorMessage">
            ❌ City not found! Please check the spelling.
        </div>
        
    </div>

    <script>
      
    // Get DOM elements
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const weatherCard = document.getElementById('weatherCard');
    const loading = document.getElementById('loading');
    const errorMessage = document.getElementById('errorMessage');

    const cityName = document.getElementById('cityName');
    const temperature = document.getElementById('temperature');
    const condition = document.getElementById('condition');
    const humidity = document.getElementById('humidity');
    const windSpeed = document.getElementById('windSpeed');
    const feelsLike = document.getElementById('feelsLike');

    // API Key
    const API_KEY = 'bd5e378503939ddaee76f12ad7a97608';

    // Function to fetch weather data
    async function getWeather(city) {
        loading.style.display = 'block';
        weatherCard.style.display = 'none';
        errorMessage.style.display = 'none';

        try {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error('City not found');
            }

            const data = await response.json();

            cityName.textContent = `${data.name}, ${data.sys.country}`;
            temperature.textContent = `${Math.round(data.main.temp)}°C`;
            condition.textContent = data.weather[0].description;
            humidity.textContent = `${data.main.humidity}%`;
            windSpeed.textContent = `${data.wind.speed} km/h`;
            feelsLike.textContent = `${Math.round(data.main.feels_like)}°C`;

            weatherCard.style.display = 'block';
            console.log('Weather data:', data);

        } catch (error) {
            errorMessage.style.display = 'block';
            console.error('Error:', error);
        } finally {
            loading.style.display = 'none';
        }
    }

    // Search button click
    searchBtn.addEventListener('click', () => {
        const city = cityInput.value.trim();
        if (city === '') {
            alert('Please enter a city name!');
            return;
        }
        getWeather(city);
    });

    // Enter key press
    cityInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            searchBtn.click();
        }
    });

    // Load default city
    getWeather('London');

        
    </script>
</body>
</html>>
